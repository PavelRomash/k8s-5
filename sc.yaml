apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-sc-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage

  local:
    path: /mnt/k8s-sc-data

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ubuntu

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-sc-pvc
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1

  selector:
    matchLabels:
      app: data-exchange-sc

  template:
    metadata:
      labels:
        app: data-exchange-sc

    spec:
      containers:

        - name: busybox
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date) - data from StorageClass" >> /data/data.txt
                sleep 5
              done
          volumeMounts:
            - name: storage-data
              mountPath: /data

        - name: multitool
          image: wbitt/network-multitool
          volumeMounts:
            - name: storage-data
              mountPath: /data

      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: local-sc-pvc
